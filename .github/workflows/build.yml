# Rebuilds the whole analysis from the raw CFPB data and publishes the dashboard to GitHub Pages.
# Runs on every push that changes the code, and on demand from the Actions tab.
name: Build analysis and publish dashboard

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sql/**"
      - "dashboard/template.html"
      - "requirements.txt"
      - "run_all.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write   # commit the generated tables and figures back to the repo
  pages: write      # publish the dashboard
  id-token: write

concurrency:
  group: build-and-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Run the pipeline (data download, SQL, NLP, models, dashboard)
        run: python run_all.py

      - name: Screenshot the dashboard for the README
        run: python src/08_screenshot.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs dashboard/index.html
          git diff --cached --quiet || git commit -m "Update generated outputs [skip ci]"
          git push

      - name: Prepare the site
        run: |
          mkdir -p site
          cp dashboard/index.html site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
